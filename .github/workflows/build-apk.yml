name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - run: flutter create --platforms=android --project-name watermark_camera .
      - run: |
          python3 - << 'EOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          if 'android.permission.NFC' not in t:
              t = t.replace('<application', '<uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n    <application', 1)
              p.write_text(t)
          print('NFC manifest patch done')
          EOF
      - run: flutter pub get
      - run: flutter analyze lib/pages/watermark_camera_page.dart lib/pages/puzzle_page.dart || true
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: watermark-camera-release-apk
          path: build/app/outputs/flutter-apk/*.apk
