name: watermark_camera
description: "水印相机 Flutter 干净重写版：拍照、导入、时间地点水印、考勤、工程、会议、监理等模板"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.7
  camera: ^0.10.6
  geolocator: ^11.0.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  pdf: 3.11.3
  url_launcher: ^6.3.0
  http: ^1.2.0
  image: 4.5.4
  nfc_manager: ^3.4.0
  ffmpeg_kit_flutter_new_min: ^3.6.7

# CI 上 image 最新版 4.11 与 Flutter 3.35 的 Dart 不兼容（decodeLazy 报错），
# 锁定到本地验证过的 4.5.4，pdf 3.11.3 与它配套。
dependency_overrides:
  image: 4.5.4
  share_plus: ^7.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
